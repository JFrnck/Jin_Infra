# Certificates wildcard por namespace consumidor: los Secrets TLS solo son
# visibles en su namespace, así que cada namespace que termina TLS necesita
# su propio Certificate. jeanfranck.com = núcleo confiable; jinserver.com =
# zona efímera de agentes (BLUEPRINT 5.2 — jamás mezclar contenidos).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jeanfranck-com
  namespace: jin
spec:
  secretName: wildcard-jeanfranck-com-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - "jeanfranck.com"
    - "*.jeanfranck.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jinserver-com
  namespace: jin
spec:
  secretName: wildcard-jinserver-com-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - "jinserver.com"
    - "*.jinserver.com"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jeanfranck-com
  namespace: observability
spec:
  secretName: wildcard-jeanfranck-com-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - "*.jeanfranck.com"
---
# Fase 5.5 (ADR 0006): pods de servicio expuestos bajo
# https://<slug>.jinserver.com terminan TLS en agents-sandbox, no en
# jin — el Secret del Certificate de arriba no es visible acá (mismo
# motivo que el resto de este archivo: Secrets TLS namespace-scoped).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jinserver-com
  namespace: agents-sandbox
spec:
  secretName: wildcard-jinserver-com-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  dnsNames:
    - "jinserver.com"
    - "*.jinserver.com"
