apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# server.mjs es un archivo real (para probarlo con `node --test`, ver
# server.test.mjs); kustomize lo convierte en el ConfigMap `claude-egress-code`.
# Las pruebas NO se incluyen en el ConfigMap.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: claude-egress-code
    namespace: claude-egress
    files:
      - server.mjs
