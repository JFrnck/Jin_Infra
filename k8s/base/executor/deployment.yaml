# jin-executor: microservicio de ejecución aislada (BLUEPRINT 4.2). Usa
# el ServiceAccount `executor` ya creado (serviceaccount.yaml) — su RBAC
# no cambia acá. En producción usa kubeConfig.loadFromCluster() (no
# necesita KUBECONFIG_PATH). Sin PVC: no persiste estado propio.
# Fase 8.1: MODAL_TOKEN_ID/SECRET ya no viven en un Secret de K8s --
# se cargan de Infisical al startup (Jin_Executor/src/config/
# secrets-loader.ts). jin-executor-secrets se eliminó por completo;
# jin-executor-infisical-auth trae solo la identidad de máquina (propia
# y separada de la de jin-core, menor privilegio).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: jin-executor
  labels:
    app.kubernetes.io/name: executor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
    spec:
      serviceAccountName: executor
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: executor
          # Tag = SHA del commit en main publicado por el CI de
          # Jin_Executor (job "docker"). Actualizar en el próximo release real.
          image: ghcr.io/jfrnck/jin-executor:b33508b6c35fa0e4cb2b692e5cafe2b647c8d61c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: jin-executor-infisical-auth
          env:
            - name: PORT
              value: "3001"
            # Fase 8.1: no secretos -- ver Jin_Executor/src/config/env.schema.ts.
            - name: INFISICAL_ENABLED
              value: "true"
            - name: INFISICAL_ENVIRONMENT
              value: prod
            # OBLIGATORIA: sin ella el SDK de Infisical apunta a
            # `app.infisical.com` (la nube de un TERCERO) y le manda las
            # credenciales de la identidad de máquina. Pasó en el primer
            # despliegue real (2026-09-21). El default de Zod no cubre este
            # camino: `loadSecrets()` corre antes de que Nest exista.
            - name: INFISICAL_SITE_URL
              value: http://infisical.jin.svc.cluster.local:8080
            # ID del proyecto `jin` de Infisical (no es un secreto) -- ver el
            # Deployment de jin-core. Credenciales: Secret
            # jin-executor-infisical-auth (08-seed-...sh).
            - name: INFISICAL_PROJECT_ID
              value: 76a57a5b-6707-41f1-b85b-559229b036a7
          ports:
            - name: http
              containerPort: 3001
          # TCP, no HTTP: a diferencia de jin-core (PR #22), Jin_Executor
          # todavía no tiene un endpoint /health propio. TCP confirma que
          # el proceso Nest ya escucha el puerto — suficiente para
          # "ReadinessProbe obligatoria" (BLUEPRINT 12.2) sin inventar un
          # endpoint HTTP que no existe. Candidato a mejorar cuando
          # Jin_Executor adopte el mismo patrón de /health que Core.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          # Presupuesto de recursos obligatorio (BLUEPRINT 3.1.1) — valores
          # exactos de la tabla, no aproximados.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
