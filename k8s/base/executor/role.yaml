# Role (no ClusterRole): permisos acotados al namespace agents-sandbox
# únicamente, según BLUEPRINT 4.2 — "nada más, sin acceso a Secrets,
# ConfigMaps, Deployments, ni otros namespaces".
#
# El permiso sobre networkpolicies (además de pods) es una extensión
# necesaria más allá del texto literal de 4.2, documentada en
# ADR 0003 punto 3: sin él, PodLifecycleService no puede crear la
# NetworkPolicy por pod que exige AGENTS.md 5.5 cuando una tool
# declare egressWhitelist no vacío (hoy ninguna lo hace — ver ADR 0003
# punto 2, UnresolvedEgressWhitelistError). Sigue sin tocar Secrets,
# ConfigMaps, Deployments ni otros namespaces.
#
# services + ingressroutes.traefik.io (Fase 5.5, ADR 0006): pods de
# servicio de larga vida expuestos bajo https://<slug>.jinserver.com.
# `list` sobre pods/services ya lo usa PreviewServiceLifecycleService
# para enumerar servicios activos (Kubernetes es el store de estado,
# sin tabla propia — ver ADR 0006 punto 3). Mismo alcance: SOLO
# agents-sandbox, sin acceso a Secrets/ConfigMaps/Deployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor-agents-sandbox
  namespace: agents-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # `patch` (2026-09-29): el Executor anota `jin.io/last-activity-at` en el pod
    # de terminal (K8sService.patchPodAnnotation) para que el reaper no lo
    # libere por inactividad mientras el owner lo usa. Sin este verbo cada
    # anotación daba 403 y la actividad quedaba vieja. Solo agents-sandbox.
    verbs: ["create", "get", "list", "delete", "patch"]
  # `pods/log` es un subrecurso de RBAC DISTINTO de `pods` -- el rule de
  # arriba no lo cubre. Sin este, K8sService.getPodLogs() (usado por
  # PodLifecycleService tras cada runCode, src/pod-lifecycle/
  # pod-lifecycle.service.ts) recibiría 403 en un clúster real. Hallazgo
  # de la auditoría de seguridad Fase 7.3 -- ningún test lo detectaba
  # porque los integration tests de K3s-testcontainers corren con un
  # kubeconfig sin restringir, no con este Role real.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # `pods/exec` (ADR 0016, sesiones de terminal): correr comandos dentro de un
  # pod que el Executor ya creó. Es un subrecurso distinto de `pods`. `create`
  # es el verbo de `exec`; `get` lo pide la variante por WebSocket en algunos
  # apiservers. Sigue acotado a agents-sandbox y sin Secrets/ConfigMaps.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # `pods/proxy` (vista previa en vivo de un servidor de la sesión, ADR 0016):
  # el Executor no alcanza los pods directamente (su NetworkPolicy excluye los
  # CIDRs del clúster), así que las peticiones HTTP a un puerto del pod pasan
  # por el API server. Un verbo por método HTTP. Acotado a agents-sandbox; el
  # Executor valida la ruta y solo apunta a pods de sesión de terminal.
  - apiGroups: [""]
    resources: ["pods/proxy"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # `persistentvolumeclaims` (ADR 0016 ampliada, 2026-09-28): un PVC por
  # workspace de terminal que sobrevive a que su pod se destruya. Sin esto el
  # Executor recibía 403 al listar workspaces y la terminal respondía 502.
  # Solo agents-sandbox; sin `update`/`patch` (el Executor nunca edita un PVC).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  # Variables de entorno por demo (ADR 0020, 2026-10-04): un Secret `demo-env-<id>` por demo,
  # ligado al pod con ownerReference. SOLO create/patch/delete: el Executor escribe el valor
  # pero NO puede leerlo de vuelta ni leer ningún otro Secret (sin get/list).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes"]
    verbs: ["create", "get", "list", "delete"]
