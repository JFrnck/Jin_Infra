# jin-core: orquestador principal (BLUEPRINT 4.1). Fase 8.1: los 13
# secretos reales (API keys, JWT_SECRET, etc.) ya NO viven en un Secret
# de K8s -- jin-core los carga de Infisical al startup (ver
# Jin_Core/src/config/secrets-loader.ts). jin-core-secrets (seed en
# bootstrap, 02-seed-secrets.sh) ahora solo trae DATABASE_URL/REDIS_URL
# (huevo-gallina de infra, no migra). jin-core-infisical-auth trae las
# credenciales de la identidad de máquina (Universal Auth) -- el único
# secreto que sigue fuera de Infisical. Probes en /health/ready y /health/live
# (PR #22 de Jin_Core) — Fase 7.1 es literalmente lo que las esperaba.
# Monta el PVC jin-core-data (k8s/base/backup/core-data-pvc.yaml, creado
# en Fase 1.2) en /data/memory — mismo contrato que ya usa
# cronjob-memory.yaml (RWO en clúster de un solo nodo: backup y core
# pueden montarlo a la vez).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jin-core
  namespace: jin
  labels:
    app.kubernetes.io/name: jin-core
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jin-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jin-core
    spec:
      # fsGroup: el volumen de memory.db debe ser escribible por el
      # usuario no-root `node` (uid/gid 1000) de la imagen runtime.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: jin-core
          # Tag = SHA del commit en main publicado por el CI de Jin_Core
          # (job "docker"). Actualizar en el próximo release real.
          image: ghcr.io/jfrnck/jin-core:c1daec9d7a4410ec94dfc3e854ba40787367264e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: jin-core-secrets
            - secretRef:
                name: jin-core-infisical-auth
          env:
            - name: PORT
              value: "3000"
            # Sin TZ el proceso corre en UTC: el cron de las 00:00 (Shadowing),
            # el de las 06:00 (alerta matutina, Fase 9.4) y el reset diario del
            # budget (`todayLocalDate`) usan hora LOCAL del proceso. Lima, igual
            # que los CronJobs de backup. Para mudarse a Canadá: cambiar esta línea.
            - name: TZ
              value: America/Lima
            - name: MEMORY_DB_PATH
              value: /data/memory/memory.db
            - name: EXECUTOR_BASE_URL
              value: http://executor.jin-executor.svc.cluster.local:3001
            # Sin esta variable TelegramBotService NUNCA llama a setWebhook
            # (solo lo hace `if (this.webhookUrl)`), así que el bot no recibe
            # updates. No es un secreto -- el secreto es TELEGRAM_WEBHOOK_SECRET
            # (Infisical), que el controller valida en cada POST. El path lo
            # expone jin-core/ingressroute.yaml (solo /telegram/webhook).
            - name: TELEGRAM_WEBHOOK_URL
              value: https://jin.jeanfranck.com/telegram/webhook
            # Fase 8.1: no secretos -- ver Jin_Core/src/config/env.schema.ts.
            - name: INFISICAL_ENABLED
              value: "true"
            - name: INFISICAL_ENVIRONMENT
              value: prod
            # OBLIGATORIA: sin ella el SDK de Infisical apunta a
            # `app.infisical.com` (la nube de un TERCERO) y le manda las
            # credenciales de la identidad de máquina. Pasó en el primer
            # despliegue real (2026-09-21). El default de Zod no cubre este
            # camino: `loadSecrets()` corre antes de que Nest exista.
            - name: INFISICAL_SITE_URL
              value: http://infisical.jin.svc.cluster.local:8080
            # ID del proyecto `jin` de Infisical (self-hosted; creado a mano en
            # el paso §7.6 del runbook). No es un secreto: solo identifica a qué
            # proyecto conectarse; las credenciales de la identidad de máquina
            # viven en el Secret jin-core-infisical-auth (08-seed-...sh).
            - name: INFISICAL_PROJECT_ID
              value: 76a57a5b-6707-41f1-b85b-559229b036a7
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          # Presupuesto de recursos obligatorio (BLUEPRINT 3.1.1) — valores
          # exactos de la tabla, no aproximados.
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: 600m
              memory: 1Gi
          volumeMounts:
            - name: core-data
              mountPath: /data/memory
            # Fase 9.5 (BLUEPRINT §12.3): pisa el default que trae la
            # imagen en config/feature-flags.yaml. jin-core lo re-lee en
            # SIGHUP (nunca automático) -- ver ConfigMap
            # jin-core-feature-flags.
            - name: feature-flags
              mountPath: /app/config/feature-flags.yaml
              subPath: feature-flags.yaml
      volumes:
        - name: core-data
          persistentVolumeClaim:
            claimName: jin-core-data
        - name: feature-flags
          configMap:
            name: jin-core-feature-flags
