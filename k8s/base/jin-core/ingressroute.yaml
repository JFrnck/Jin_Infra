# Ruteo estático (a diferencia de las IngressRoutes dinámicas que crea
# Jin_Executor por preview — ver ADR 0006 punto 7 / k8s.service.ts):
# jin.jeanfranck.com/api, /telegram/webhook y /socket.io -> jin-core; el
# resto del host -> jin-web (dashboard, dentro del clúster — reemplaza a
# Cloudflare Pages, ver Jin_Web/.github/workflows/ci.yml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jin-core-api
  namespace: jin
spec:
  entryPoints:
    - websecure
  routes:
    # El puente Claude Code ↔ owner (ADR 0012) NO sale a internet. El CLI
    # `jin-relay` corre en el nodo y llega a jin-core:3000 por la red del
    # clúster, así que no necesita esta puerta.
    #
    # Va ANTES y con prioridad explícita: la regla de abajo es PathPrefix(`/api`)
    # y se llevaría /api/relay. Traefik ordena por longitud de regla y esta ya
    # ganaría sola, pero una precedencia implícita no es una frontera de
    # seguridad — si alguien acorta la otra regla, esto deja de cumplirse en
    # silencio.
    - match: Host(`jin.jeanfranck.com`) && PathPrefix(`/api/relay`)
      kind: Rule
      priority: 100
      middlewares:
        - name: deny-public
      services:
        - name: jin-core
          port: 3000
    - match: Host(`jin.jeanfranck.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 10
      services:
        - name: jin-core
          port: 3000
    # Webhook de Telegram: el controller vive en POST /telegram/webhook (sin
    # prefijo /api), así que la regla de arriba nunca lo alcanzaba y Telegram
    # -- único canal de aprobación HITL -- no podía entregar updates. Se abre
    # ÚNICAMENTE ese path exacto, no /telegram/*. La autenticidad la valida
    # el controller con X-Telegram-Bot-Api-Secret-Token (TELEGRAM_WEBHOOK_SECRET).
    - match: Host(`jin.jeanfranck.com`) && Path(`/telegram/webhook`)
      kind: Rule
      # Explícita como las otras dos: mezclar prioridades puestas a mano con
      # prioridades implícitas (Traefik las deduce de la longitud de la regla)
      # hace que el orden real dependa de cuánto mide el texto del match.
      priority: 50
      services:
        - name: jin-core
          port: 3000
    # Hallazgo real (despliegue de Jin_Web en la VM): ni RealtimeGateway ni
    # ChatGateway (Jin_Core) fijan un `path` custom en @WebSocketGateway(),
    # así que socket.io usa su default `/socket.io/` -- un path que ninguna
    # regla de acá cubría. En producción el dashboard se hubiera quedado sin
    # tiempo real (badge "EN VIVO", avisos de pending-approval:new, chat por
    # WS) de forma completamente silenciosa. Prioridad explícita, mismo
    # criterio que las demás reglas de este archivo.
    - match: Host(`jin.jeanfranck.com`) && PathPrefix(`/socket.io`)
      kind: Rule
      priority: 20
      services:
        - name: jin-core
          port: 3000
    # Catch-all del dashboard (Jin_Web) -- tiene que perder contra CUALQUIER
    # otra regla de este archivo o se comería sus requests. Prioridad
    # explícita y la más baja de todas, por el mismo motivo que las de
    # arriba: una precedencia implícita por longitud de match no es una
    # frontera confiable.
    - match: Host(`jin.jeanfranck.com`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: jin-web
          port: 80
  tls:
    secretName: wildcard-jeanfranck-com-tls
