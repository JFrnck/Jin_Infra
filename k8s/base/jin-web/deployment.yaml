# jin-web: build estático de React Router (ssr:false) servido por un nginx
# no-root, dentro del mismo clúster K3s que jin-core (revierte la decisión
# original de Cloudflare Pages — ver ingressroute.yaml de jin-core para el
# contexto completo). Sin PVC, sin secretos, sin Infisical: es un nginx que
# sirve archivos ya horneados en la imagen, no tiene nada que leer en runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jin-web
  namespace: jin
  labels:
    app.kubernetes.io/name: jin-web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jin-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jin-web
    spec:
      # nginxinc/nginx-unprivileged corre como el usuario `nginx` (uid/gid
      # 101) y escucha en 8080 -- ver Dockerfile/nginx.conf. Mismo criterio
      # de seguridad que jin-core: no-root, sin escalar privilegios, sin
      # capabilities.
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: jin-web
          # Tag = SHA del commit de merge en main publicado por el CI de
          # Jin_Web (job "docker") -- Jin_Web PR #15 (sección "Claude Code"
          # del dashboard, consume Jin_Core#49).
          image: ghcr.io/jfrnck/jin-web:a90866a165277570299a09f5e88c240526b101b7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Nginx estático sirviendo archivos ya construidos: no necesita el
          # presupuesto de jin-core/executor.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
