apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - networkpolicies.yaml
  - deployment.yaml
  - service.yaml

# server.mjs es una copia literal de ../claude-egress/server.mjs (kustomize no
# permite referenciar archivos fuera de este directorio). Si se corrige uno,
# corregir el otro. Las pruebas viven solo en claude-egress.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: mail-egress-code
    namespace: mail-egress
    files:
      - server.mjs
