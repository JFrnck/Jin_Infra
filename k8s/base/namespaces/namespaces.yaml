# Namespaces según BLUEPRINT.md 4.3.
# PSA: agents-sandbox corre código LLM-generado → "restricted".
# observability queda sin enforce porque promtail necesita hostPath (/var/log/pods).
apiVersion: v1
kind: Namespace
metadata:
  name: jin
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: jin-executor
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: agents-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Proxy de npm de las sesiones de terminal (ADR 0016). Corre una imagen
# oficial, no código generado: baseline alcanza.
apiVersion: v1
kind: Namespace
metadata:
  name: registry-proxy
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# Proxy de salida de Claude Code (ADR 0017): imagen oficial de Node con un script
# de ~150 líneas, sin root ni capabilities. Cumple `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: claude-egress
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
