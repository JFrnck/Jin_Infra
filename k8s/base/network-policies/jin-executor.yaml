# El Executor solo recibe de jin (HTTP interno) y sale a: DNS,
# kube-apiserver (vía IP del nodo, fuera de los CIDRs de pods/services)
# y Modal (internet). No alcanza pods de otros namespaces directamente:
# todo lo que hace en agents-sandbox pasa por el apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: jin-executor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-jin
  namespace: jin-executor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jin
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allowlist
  namespace: jin-executor
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Fase 8.1: Infisical (sus secretos de Modal) -- el ipBlock de abajo excluye
    # los CIDRs del clúster a propósito, así que hace falta esta regla explícita.
    # Solo el pod de Infisical y solo el 8080: Postgres, Redis y jin-core siguen
    # fuera de alcance.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: infisical
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
