# Aislamiento del namespace jin (BLUEPRINT 4.3):
# recibe de kube-system (Traefik) e intra-namespace; puede iniciar tráfico a
# jin-executor y a internet, pero JAMÁS a agents-sandbox.
# CIDRs excluidos = pod/service CIDRs por defecto de K3s (10.42/16, 10.43/16);
# ajustar si el bootstrap los cambia.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: jin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: jin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-kube-system
  namespace: jin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
---
# Fase 8.1: el Executor lee SUS secretos (Modal) de Infisical al arrancar, y
# Infisical vive acá. Sin esta regla el pod queda en CrashLoopBackOff con
# `fetch failed` (visto en el primer despliegue real, 2026-09-21): la política
# se escribió antes de que el Executor dependiera de Infisical y nunca se
# actualizó. Se abre lo MÍNIMO: solo hacia el pod de Infisical y solo al 8080
# -- Postgres y Redis siguen inalcanzables desde jin-executor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infisical-from-executor
  namespace: jin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: infisical
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jin-executor
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-allowlist
  namespace: jin
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Intra-namespace (core → Postgres/Redis/Infisical).
    - to:
        - podSelector: {}
    # kube-system: DNS (CoreDNS) y Traefik (cloudflared publica hacia él).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Executor: única ruta autorizada hacia ejecución de código.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jin-executor
    # Internet (APIs LLM, Cloudflare, Google...), nunca pods/services de
    # otros namespaces: los CIDRs del clúster quedan excluidos.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
