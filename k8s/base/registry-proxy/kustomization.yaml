apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# La config vive en un archivo real (config.yaml) para poder probarla con
# Docker; kustomize la convierte en el ConfigMap `verdaccio-config`.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: verdaccio-config
    namespace: registry-proxy
    files:
      - config.yaml
